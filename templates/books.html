<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0C">
  <title>Gin Books — Katalog Koleksi</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Bricolage Grotesque', 'Outfit', system-ui, sans-serif;
      --font-body: 'Outfit', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --scroll-y: 0;
      --bg: #0A0A0C;
      --sidebar: #141417;
      --surface: #18181D;
      --surface-hover: #212128;
      --border: #272730;
      --text: #FAFAFA;
      --text-muted: #A1A1AA;
      --ink: #111113;
      --yellow: #FAD337;
      --orange: #F15A24;
      --pink: #F472B6;
      --teal: #2DD4BF;
      --danger: #B91C1C;
      --danger-soft: #2A1215;
      --danger-text: #FCA5A5;
      --success: #047857;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: var(--yellow); color: var(--ink); }
    html { scrollbar-width: thin; scrollbar-color: #2D2D36 #0A0A0C; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
        transform: none !important;
      }
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: clip;
    }

    h1, h2, h3, .brand-name, .book-card-title, .pinned-stat-val {
      font-family: var(--font-display);
      text-wrap: balance;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2D2D36; border-radius: 999px; }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 12px;
      background: var(--yellow);
      color: var(--ink);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      z-index: 2000;
      text-decoration: none;
    }
    .skip-link:focus { left: 16px; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 24px 16px 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 10px 24px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 12px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--surface-hover);
      color: var(--text);
      font-weight: 700;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .nav-count {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-chip {
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .user-chip-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-chip-role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .btn-logout {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: var(--danger-soft);
      border-color: #7F1D1D;
      color: var(--danger-text);
    }

    /* Main Workspace (clip preserves sticky positioning cleanly) */
    .main-area {
      padding: 16px 28px 116px;
      max-width: 1240px;
      width: 100%;
      min-width: 0;
      margin: 0 auto;
      overflow-x: clip;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      margin: 0 0 18px;
      background: rgba(10, 10, 12, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      flex-wrap: wrap;
      transition: border-color 0.2s ease;
    }

    .topbar.is-scrolled {
      border-bottom-color: var(--border);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .topbar-left h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.025em;
      white-space: nowrap;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
      min-width: 240px;
      flex-wrap: wrap;
    }

    .mobile-menu-btn {
      display: none;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 6px 4px 14px;
      transition: border-color 0.15s ease;
    }

    .search-wrap:focus-within {
      border-color: var(--yellow);
    }

    .clear-search-btn {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .clear-search-btn:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .search-wrap input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 4px;
      outline: none;
    }

    .search-wrap input::placeholder { color: var(--text-muted); }

    .btn-pill {
      min-height: 38px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-pill:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .btn-primary { background: var(--yellow); color: var(--ink); }
    .btn-dark { background: var(--ink); color: var(--text); }
    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .page-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .page-title-row h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 26px 0 14px;
    }

    .section-heading h2 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .text-link-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .text-link-btn:hover { color: var(--text); background: var(--surface); }

    /* Hero Editorial Bento (2 Featured Cards) */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .hero-card {
      border-radius: 22px;
      padding: 24px 20px 0 24px;
      color: var(--ink);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 152px;
      gap: 10px;
      align-items: stretch;
      min-height: 196px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      --hx: 0px;
      --hy: 0px;
      transition: transform 0.18s ease;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      inset: -18px;
      background-image: radial-gradient(rgba(17, 17, 19, 0.14) 1px, transparent 1px);
      background-size: 16px 16px;
      transform: translate3d(calc(var(--hx) * -0.45), calc(var(--hy) * -0.45 + var(--scroll-y) * 0.04px), 0);
      pointer-events: none;
      opacity: 0.45;
    }

    .hero-card > * {
      position: relative;
      z-index: 1;
    }

    .hero-card > div:first-child {
      padding-bottom: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-card:hover .hero-art svg {
      transform: translate3d(var(--hx), calc(var(--hy) - 3px + var(--scroll-y) * -0.06px), 0);
    }
    .hero-card--yellow { background: var(--yellow); }
    .hero-card--orange { background: var(--orange); }

    .hero-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(17, 17, 19, 0.35);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
      max-width: 100%;
    }

    .hero-card h3 {
      font-size: 25px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.025em;
      margin-bottom: 16px;
      color: var(--ink);
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-art {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      height: 100%;
    }

    .hero-art svg {
      width: 148px;
      height: 126px;
      display: block;
      transform: translate3d(var(--hx), calc(var(--hy) + var(--scroll-y) * -0.06px), 0);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    /* Pinned Split-Scroll Section (Telemetry + Book Focus Pinned Left, Parallax Track Right) */
    .pinned-editorial {
      display: grid;
      grid-template-columns: 356px minmax(0, 1fr);
      gap: 20px;
      margin-top: 26px;
      align-items: start;
    }

    .pinned-rail {
      position: sticky;
      top: 86px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .pinned-rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .pinned-rail-head h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .stats-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .stat-tile {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px;
    }

    .pinned-stat-val {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.1;
    }

    .pinned-stat-lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .cat-bar-list {
      display: grid;
      gap: 8px;
    }

    .cat-bar-row {
      display: grid;
      gap: 4px;
    }

    .cat-bar-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .cat-bar-track {
      height: 6px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .cat-bar-fill {
      height: 100%;
      background: var(--yellow);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pinned-focus-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .focus-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 65ch;
      text-wrap: pretty;
    }

    .pinned-scroll-track {
      min-width: 0;
    }

    .pinned-scroll-track .section-heading {
      margin-top: 0;
    }

    .sort-select {
      min-height: 36px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .section-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .parallax-card {
      transform: translate3d(0, var(--card-py, 0px), 0);
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Highlight Compact Rows */
    .highlight-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .highlight-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1.5fr) minmax(0, 1fr) 90px 44px;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .highlight-row:hover,
    .highlight-row.is-selected {
      background: var(--surface-hover);
      border-color: var(--yellow);
    }

    .thumb-tile {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      flex-shrink: 0;
    }

    .row-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-cat {
      font-size: 13px;
      color: var(--text-muted);
    }

    .row-stock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--text);
      text-align: right;
    }

    .icon-btn {
      min-width: 40px;
      min-height: 40px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--bg); color: var(--text); }
    .icon-btn.is-active { color: var(--yellow); }

    /* Category Filter Pills */
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      min-height: 36px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-pill:hover { background: var(--surface-hover); }
    .filter-pill.active {
      background: var(--text);
      color: var(--ink);
      border-color: var(--text);
    }

    /* 4-Color Vibrant Bento Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .book-card {
      border-radius: 18px;
      padding: 18px;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 196px;
      cursor: pointer;
      position: relative;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .book-card:hover { transform: translateY(-2px); }
    .book-card.is-selected { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
    .tone-pink { background: var(--pink); }
    .tone-teal { background: var(--teal); }
    .tone-orange { background: var(--orange); }
    .tone-yellow { background: var(--yellow); }

    .book-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(17, 17, 19, 0.34);
      background: transparent;
      color: var(--ink);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .book-card-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin-top: 8px;
      color: var(--ink);
    }

    .book-card-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-top: 4px;
    }

    .book-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(17, 17, 19, 0.15);
    }

    .card-mini-btn {
      background: var(--ink);
      color: var(--text);
      border: none;
      border-radius: 999px;
      padding: 6px 11px;
      min-height: 30px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Structured Table View (Koleksi / Stok Menipis) */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th {
      text-align: left;
      padding: 13px 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-hover); }

    .mono-tag {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
    }

    .stock-pill {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0F291E;
      color: #86EFAC;
      display: inline-block;
    }

    .stock-pill--low {
      background: var(--danger-soft);
      color: var(--danger-text);
    }

    .table-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .btn-xs {
      min-height: 32px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-xs:hover { border-color: var(--yellow); color: var(--yellow); }
    .btn-xs--danger:hover { border-color: #EF4444; color: var(--danger-text); }

    /* Bottom Sticky Quick-Inspector Dock */
    .inspector-dock {
      position: fixed;
      left: 240px;
      right: 20px;
      bottom: 14px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      z-index: 50;
    }

    .dock-book {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .dock-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 6px;
    }

    .stepper-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: none;
      background: var(--surface-hover);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    .stepper-btn:hover { background: var(--yellow); color: var(--ink); }

    .stepper-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      padding: 0 6px;
      min-width: 58px;
      text-align: center;
    }

    /* Profile Card */
    .profile-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      max-width: 560px;
      display: grid;
      gap: 14px;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 36px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 18px;
      font-size: 14.5px;
    }

    /* Accessible Modal Dialog */
    dialog.book-dialog {
      margin: auto;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      width: 500px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.7);
    }

    dialog.book-dialog::backdrop {
      background: rgba(0, 0, 0, 0.72);
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .dialog-head h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid-3 {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.9fr;
      gap: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      display: none;
      z-index: 200;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
    }

    .toast.success { background: var(--success); color: #ECFDF5; }
    .toast.error { background: var(--danger); color: #FEF2F2; }

    @media (max-width: 1080px) {
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-grid { grid-template-columns: 1fr; }
      .pinned-editorial { grid-template-columns: 1fr; }
      .pinned-rail { position: static; }
    }

    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: -260px;
        width: 244px;
        transition: left 0.2s ease;
      }
      .sidebar.open { left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .main-area { padding: 18px 16px 156px; }
      .inspector-dock {
        left: 12px;
        right: 12px;
        bottom: 10px;
        padding: 12px 14px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .dock-book { width: 100%; }
      .dock-controls {
        width: 100%;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 8px;
      }
      .highlight-row { grid-template-columns: 44px minmax(0, 1fr) auto 40px; }
      .row-cat { display: none; }
    }

    @media (max-width: 540px) {
      .cards-grid { grid-template-columns: 1fr; }
      .hero-card { grid-template-columns: 1fr; }
      .hero-art { display: none; }
      .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">Lewati ke konten utama</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">

    </aside>

    <main class="main-area" id="mainContent">

            <input type="text" id="searchInput" aria-label="Cari judul, penulis, kategori, atau ISBN" placeholder="Cari judul, penulis, kategori, ISBN...">

            <button type="button" class="btn-pill btn-ghost" style="min-height:34px;padding:6px 14px;" onclick="searchBooks()">Cari</button>
          </div>
          <button type="button" class="btn-pill btn-primary" onclick="openAddModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>

    ];

    let allBooks = [];
    let catalogStats = null;
    let currentUser = null;
    let activeView = 'foryou';
    let activeCategory = 'Semua';
    let activeSort = '';
    let selectedBookId = null;
    let lastOpener = null;

    function getAuthHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('auth_token');
      if (token) headers['Authorization'] = 'Bearer ' + token;
      return headers;
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.className = 'toast ' + type;
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    async function checkAuth() {
      try {
        const res = await fetch(API_BASE + '/api/me', { headers: getAuthHeaders() });
        if (!res.ok) {
          window.location.href = '/login';
          return false;
        }
        const payload = await res.json();
        const user = payload.data || payload;
        if (user && user.username) {
          currentUser = user;
          document.getElementById('userNameLabel').textContent = user.full_name || user.username;
          document.getElementById('userRoleLabel').textContent = user.role || 'User';
        }
        return true;
      } catch (err) {
        window.location.href = '/login';
        return false;
      }
    }

    async function logout() {
      if (!confirm('Apakah Anda yakin ingin keluar?')) return;
      try {
        await fetch(API_BASE + '/api/logout', { method: 'POST', headers: getAuthHeaders() });
      } catch (e) {}
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_profile');
      window.location.href = '/login';
    }

    async function loadBooks(searchQuery = '') {
      try {
        const params = new URLSearchParams();
        if (searchQuery) params.set('q', searchQuery);
        if (activeSort) params.set('sort', activeSort);
        const url = API_BASE + '/api/books' + (params.toString() ? '?' + params.toString() : '');
        const res = await fetch(url, { headers: getAuthHeaders() });
        if (res.status === 401) {
          window.location.href = '/login';
          return;
        }
        const payload = await res.json();
        allBooks = Array.isArray(payload.data) ? payload.data : [];
        if (allBooks.length > 0 && !allBooks.some(b => b.id === selectedBookId)) {
          selectedBookId = allBooks[0].id;
        } else if (allBooks.length === 0) {
          selectedBookId = null;
        }
        updateSidebarCounts();
        loadStats();
        renderCurrentView();
        renderDock();
      } catch (err) {
        showToast('Gagal memuat data buku', 'error');
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(API_BASE + '/api/books/stats', { headers: getAuthHeaders() });
        if (res.ok) {
          const payload = await res.json();
          if (payload && payload.data) {
            catalogStats = payload.data;
            renderTelemetry();
            return;
          }
        }
      } catch (e) {}
      renderTelemetry();
    }

    function computeLocalStats() {
      const catCounts = {};
      let totalStock = 0;
      let bookmarked = 0;
      let lowStock = 0;
      allBooks.forEach(b => {
        totalStock += Number(b.stock) || 0;
        if (b.is_bookmarked) bookmarked++;
        if ((Number(b.stock) || 0) <= 5) lowStock++;
        const cat = (b.category || 'Umum').trim() || 'Umum';
        catCounts[cat] = (catCounts[cat] || 0) + 1;
      });
      const categories = Object.keys(catCounts)
        .map(name => ({ name, count: catCounts[name] }))
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
      return { total_books: allBooks.length, total_stock: totalStock, bookmarked_count: bookmarked, low_stock_count: lowStock, categories };
    }

    function renderTelemetry() {
      const stats = catalogStats || computeLocalStats();
      const stockEl = document.getElementById('statTotalStock');
      const bmEl = document.getElementById('statBookmarks');
      const lowEl = document.getElementById('statLowStock');
      if (stockEl) stockEl.textContent = String(stats.total_stock || 0);
      if (bmEl) bmEl.textContent = String(stats.bookmarked_count || 0);
      if (lowEl) lowEl.textContent = String(stats.low_stock_count || 0);

      const barList = document.getElementById('categoryBarList');
      if (!barList) return;
      barList.innerHTML = '';
      const cats = Array.isArray(stats.categories) ? stats.categories.slice(0, 4) : [];
      const maxCount = Math.max(1, ...cats.map(c => c.count || 0));
      cats.forEach(c => {
        const row = document.createElement('div');
        row.className = 'cat-bar-row';
        const meta = document.createElement('div');
        meta.className = 'cat-bar-meta';
        const name = document.createElement('span');
        name.textContent = c.name;
        const count = document.createElement('span');
        count.className = 'mono-tag';
        count.textContent = String(c.count) + ' buku';
        meta.appendChild(name);
        meta.appendChild(count);
        const track = document.createElement('div');
        track.className = 'cat-bar-track';
        const fill = document.createElement('div');
        fill.className = 'cat-bar-fill';
        fill.style.width = Math.round(((c.count || 0) / maxCount) * 100) + '%';
        track.appendChild(fill);
        row.appendChild(meta);
        row.appendChild(track);
        barList.appendChild(row);
      });
      renderPinnedFocus();
    }

    function renderPinnedFocus() {
      const box = document.getElementById('pinnedFocusCard');
      if (!box) return;
      box.innerHTML = '';
      const book = allBooks.find(b => b.id === selectedBookId) || allBooks[0];
      if (!book) {
        const p = document.createElement('p');
        p.className = 'focus-desc';
        p.textContent = 'Pilih buku di katalog untuk melihat ringkasan dan detail ISBN.';
        box.appendChild(p);
        return;
      }

      const head = document.createElement('div');
      head.style.display = 'flex';
      head.style.justifyContent = 'space-between';
      head.style.alignItems = 'center';
      head.style.gap = '8px';

      const cat = document.createElement('span');
      cat.className = 'nav-count';
      cat.textContent = book.category || 'Umum';

      const meta = document.createElement('span');
      meta.className = 'mono-tag';
      meta.style.color = 'var(--text-muted)';
      meta.textContent = (book.publish_year > 0 ? book.publish_year + ' • ' : '') + (book.isbn || 'Tanpa ISBN');

      head.appendChild(cat);
      head.appendChild(meta);

      const title = document.createElement('div');
      title.className = 'row-title';
      title.textContent = book.title;

      const desc = document.createElement('p');
      desc.className = 'focus-desc';
      desc.textContent = book.description || 'Belum ada ringkasan untuk buku ini. Klik Edit untuk melengkapi deskripsi.';

      box.appendChild(head);
      box.appendChild(title);
      box.appendChild(desc);
    }

    async function downloadBooksCSV() {
      try {
        const params = new URLSearchParams();
        const q = document.getElementById('searchInput').value.trim();
        if (q) params.set('q', q);
        if (activeSort) params.set('sort', activeSort);
        const res = await fetch(API_BASE + '/api/books/export' + (params.toString() ? '?' + params.toString() : ''), {
          headers: getAuthHeaders()
        });
        if (!res.ok) {
          showToast('Gagal mengekspor CSV', 'error');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gin-books-katalog.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Berkas gin-books-katalog.csv diunduh');
      } catch (err) {
        showToast('Gagal mengekspor CSV', 'error');
      }
    }

    function updateSidebarCounts() {
      document.getElementById('navTotalCount').textContent = String(allBooks.length);
      document.getElementById('navSavedCount').textContent = String(allBooks.filter(b => b.is_bookmarked).length);
      document.getElementById('navLowCount').textContent = String(allBooks.filter(b => (b.stock || 0) <= 5).length);
    }

    function switchView(view) {
      activeView = view;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      document.getElementById('sidebar').classList.remove('open');
      if (view === 'search') {
        document.getElementById('searchInput').focus();
      }
      renderCurrentView();
    }

    function getFilteredBooks() {
      let list = [...allBooks];
      if (activeView === 'bookmarks') list = list.filter(b => b.is_bookmarked);
      if (activeView === 'lowstock') list = list.filter(b => (b.stock || 0) <= 5);
      if (activeCategory !== 'Semua' && (activeView === 'foryou' || activeView === 'search')) {
        list = list.filter(b => (b.category || 'Umum').toLowerCase() === activeCategory.toLowerCase());
      }
      return list;
    }

    function renderCurrentView() {
      const titles = {
        foryou: 'Untuk Kamu',
        search: 'Cari Koleksi',
        library: 'Semua Koleksi',
        bookmarks: 'Buku Tersimpan',
        lowstock: 'Stok Menipis',
        settings: 'Profil & Ringkasan'
      };
      document.getElementById('viewTitle').textContent = titles[activeView] || 'Koleksi';

      const editorialEl = document.getElementById('editorialSection');
      const tableEl = document.getElementById('tableSection');
      const profileEl = document.getElementById('profileSection');
      const emptyEl = document.getElementById('emptyMessage');

      editorialEl.style.display = 'none';
      tableEl.style.display = 'none';
      profileEl.style.display = 'none';
      emptyEl.style.display = 'none';

      if (activeView === 'settings') {
        profileEl.style.display = 'block';
        renderProfile();
        return;
      }

      const list = getFilteredBooks();
      if (activeView === 'library' || activeView === 'lowstock') {
        if (list.length === 0) {
          emptyEl.style.display = 'block';
          return;
        }
        tableEl.style.display = 'block';
        renderTable(list);
        return;
      }

      editorialEl.style.display = 'block';
      const showHero = activeView === 'foryou';
      document.getElementById('heroGrid').style.display = showHero ? 'grid' : 'none';
      document.getElementById('highlightsHeader').style.display = showHero ? 'flex' : 'none';
      document.getElementById('highlightList').style.display = showHero ? 'flex' : 'none';

      if (showHero) {
        renderHero(allBooks.slice(0, 2));
        renderHighlights(allBooks.slice(0, 5));
      }
      renderTelemetry();
      renderCategoryPills();
      renderCardsGrid(list);
      if (list.length === 0) emptyEl.style.display = 'block';
    }

    function createStaticSvg(svgMarkup) {
      const wrap = document.createElement('span');
      wrap.innerHTML = svgMarkup;
      return wrap.firstElementChild;
    }

    function renderHero(featured) {
      const grid = document.getElementById('heroGrid');
      grid.innerHTML = '';
      if (featured.length === 0) return;

      featured.forEach((book, idx) => {
        const card = document.createElement('article');
        card.className = 'hero-card ' + (idx === 0 ? 'hero-card--yellow' : 'hero-card--orange');
        card.tabIndex = 0;
        card.setAttribute('aria-label', 'Pilih buku unggulan ' + book.title);
        card.addEventListener('click', () => selectBook(book.id));
        card.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) {
            e.preventDefault();
            selectBook(book.id);
          }
        });

        const left = document.createElement('div');
        const pill = document.createElement('span');
        pill.className = 'hero-meta-pill';
        pill.textContent = book.author + ' • ' + (book.publish_year > 0 ? book.publish_year : 'Baru');

        const title = document.createElement('h3');
        title.textContent = book.title;

        const actions = document.createElement('div');
        actions.className = 'hero-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn-pill btn-dark';
        editBtn.textContent = idx === 0 ? 'Kelola Buku' : 'Stok: ' + (book.stock || 0) + ' pcs';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(book);
        });
        actions.appendChild(editBtn);

        left.appendChild(pill);
        left.appendChild(title);
        left.appendChild(actions);

        const art = document.createElement('div');
        art.className = 'hero-art';
        art.appendChild(createStaticSvg(HERO_INK_ARTWORKS[idx % HERO_INK_ARTWORKS.length]));

        card.appendChild(left);
        card.appendChild(art);
        grid.appendChild(card);
      });
    }

    function renderHighlights(items) {
      const list = document.getElementById('highlightList');
      list.innerHTML = '';
      const tileColors = ['var(--pink)', 'var(--teal)', 'var(--yellow)'];

      items.forEach((book, idx) => {
        const row = document.createElement('div');
        row.className = 'highlight-row parallax-card' + (book.id === selectedBookId ? ' is-selected' : '');
        row.dataset.parallax = String(((idx % 3) - 1) * 0.03);
        row.tabIndex = 0;
        row.addEventListener('click', () => selectBook(book.id));
        row.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) {
            e.preventDefault();
            selectBook(book.id);
          }
        });

        const thumb = document.createElement('div');
        thumb.className = 'thumb-tile';
        thumb.style.background = tileColors[idx % tileColors.length];
        const mini = createStaticSvg(INK_ARTWORKS[idx % INK_ARTWORKS.length]);
        mini.setAttribute('width', '28');
        mini.setAttribute('height', '24');
        thumb.appendChild(mini);

        const info = document.createElement('div');
        info.style.minWidth = '0';
        const t = document.createElement('div');
        t.className = 'row-title';
        t.textContent = book.title;
        const s = document.createElement('div');
        s.className = 'row-sub';
        s.textContent = book.author;
        info.appendChild(t);
        info.appendChild(s);

        const cat = document.createElement('div');
        cat.className = 'row-cat';
        cat.textContent = book.category || 'Umum';

        const stock = document.createElement('div');
        stock.className = 'row-stock';
        stock.textContent = (book.stock || 0) + ' pcs';

        const bmBtn = document.createElement('button');
        bmBtn.type = 'button';
        bmBtn.className = 'icon-btn' + (book.is_bookmarked ? ' is-active' : '');
        bmBtn.setAttribute('aria-label', 'Simpan buku ' + book.title);
        const bmIcon = createStaticSvg('<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>');
        if (book.is_bookmarked) bmIcon.setAttribute('fill', 'currentColor');
        bmBtn.appendChild(bmIcon);
        bmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleBookmark(book.id);
        });

        row.appendChild(thumb);
        row.appendChild(info);
        row.appendChild(cat);
        row.appendChild(stock);
        row.appendChild(bmBtn);
        list.appendChild(row);
      });
    }

    function renderCategoryPills() {
      const container = document.getElementById('categoryPills');
      container.innerHTML = '';
      const cats = ['Semua'];
      allBooks.forEach(b => {
        const c = (b.category || 'Umum').trim();
        if (c && !cats.includes(c)) cats.push(c);
      });

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-pill' + (activeCategory === cat ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          activeCategory = cat;
          renderCurrentView();
        });
        container.appendChild(btn);
      });
    }

    function renderCardsGrid(books) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      books.forEach((book, idx) => {
        const card = document.createElement('article');
        card.className = 'book-card ' + CARD_TONES[idx % CARD_TONES.length] + (book.id === selectedBookId ? ' is-selected' : '');
        card.tabIndex = 0;
        card.setAttribute('aria-label', 'Pilih buku ' + book.title);
        card.addEventListener('click', () => selectBook(book.id));
        card.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) {
            e.preventDefault();
            selectBook(book.id);
          }
        });

        const top = document.createElement('div');
        top.className = 'book-card-top';
        const badge = document.createElement('span');
        badge.className = 'card-badge';
        badge.textContent = book.category || 'Umum';
        const art = createStaticSvg(INK_ARTWORKS[idx % INK_ARTWORKS.length]);
        top.appendChild(badge);
        top.appendChild(art);

        const mid = document.createElement('div');
        const title = document.createElement('h3');
        title.className = 'book-card-title';
        title.textContent = book.title;
        const author = document.createElement('div');
        author.className = 'book-card-author';
        author.textContent = book.author;
        mid.appendChild(title);
        mid.appendChild(author);

        const foot = document.createElement('div');
        foot.className = 'book-card-foot';
        const stockText = document.createElement('span');
        stockText.className = 'mono-tag';
        stockText.textContent = (book.stock || 0) + ' pcs';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'card-mini-btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(book);
        });

        foot.appendChild(stockText);
        foot.appendChild(editBtn);

        card.appendChild(top);
        card.appendChild(mid);
        card.appendChild(foot);
        grid.appendChild(card);
      });
    }

    function makeCell(text, className) {
      const td = document.createElement('td');
      if (className) td.className = className;
      td.textContent = text;
      return td;
    }

    function renderTable(books) {
      const tbody = document.getElementById('booksTableBody');
      tbody.innerHTML = '';

      books.forEach(book => {
        const tr = document.createElement('tr');
        tr.addEventListener('click', () => selectBook(book.id));

        tr.appendChild(makeCell('#' + book.id, 'mono-tag'));
        tr.appendChild(makeCell(book.title));
        tr.appendChild(makeCell(book.author));
        tr.appendChild(makeCell(book.category || 'Umum'));
        tr.appendChild(makeCell(book.isbn || '-', 'mono-tag'));
        tr.appendChild(makeCell(book.publish_year > 0 ? String(book.publish_year) : '-', 'mono-tag'));

        const stockTd = document.createElement('td');
        const stockBadge = document.createElement('span');
        const qty = book.stock || 0;
        stockBadge.className = 'stock-pill' + (qty <= 5 ? ' stock-pill--low' : '');
        stockBadge.textContent = qty + ' pcs';
        stockTd.appendChild(stockBadge);
        tr.appendChild(stockTd);

        const actTd = document.createElement('td');
        const actWrap = document.createElement('div');
        actWrap.className = 'table-actions';

        const plusBtn = document.createElement('button');
        plusBtn.type = 'button';
        plusBtn.className = 'btn-xs';
        plusBtn.textContent = '+1 Stok';
        plusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          adjustStock(book.id, 1);
        });

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn-xs';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(book);
        });

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-xs btn-xs--danger';
        delBtn.textContent = 'Hapus';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteBook(book.id);
        });

        actWrap.appendChild(plusBtn);
        actWrap.appendChild(editBtn);
        actWrap.appendChild(delBtn);
        actTd.appendChild(actWrap);
        tr.appendChild(actTd);

        tbody.appendChild(tr);
      });
    }

    function renderProfile() {
      const panel = document.getElementById('profilePanel');
      panel.innerHTML = '';
      const items = [
        ['Nama Lengkap', (currentUser && currentUser.full_name) || '-'],
        ['Username', (currentUser && currentUser.username) || '-'],
        ['Role Akun', (currentUser && currentUser.role) || 'User'],
        ['Total Judul Buku', String(allBooks.length) + ' judul'],
        ['Total Stok Tersedia', String(allBooks.reduce((acc, b) => acc + (b.stock || 0), 0)) + ' pcs'],
        ['Buku Tersimpan', String(allBooks.filter(b => b.is_bookmarked).length) + ' judul']
      ];
      items.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.borderBottom = '1px solid var(--border)';
        row.style.paddingBottom = '10px';
        const k = document.createElement('span');
        k.style.color = 'var(--text-muted)';
        k.textContent = label;
        const v = document.createElement('strong');
        v.textContent = value;
        row.appendChild(k);
        row.appendChild(v);
        panel.appendChild(row);
      });
    }

    function selectBook(id) {
      selectedBookId = id;
      renderCurrentView();
      renderPinnedFocus();
      renderDock();
    }

    function renderDock() {
      const dock = document.getElementById('inspectorDock');
      const book = allBooks.find(b => b.id === selectedBookId);
      if (!book) {
        dock.style.display = 'none';
        return;
      }
      dock.style.display = 'flex';
      document.getElementById('dockTitle').textContent = book.title;
      document.getElementById('dockSub').textContent = book.author + ' • ' + (book.category || 'Umum');
      document.getElementById('dockStockVal').textContent = (book.stock || 0) + ' pcs';

      const thumb = document.getElementById('dockThumb');
      thumb.innerHTML = '';
      const mini = createStaticSvg(INK_ARTWORKS[book.id % INK_ARTWORKS.length]);
      mini.setAttribute('width', '26');
      mini.setAttribute('height', '22');
      thumb.appendChild(mini);

      const bmBtn = document.getElementById('dockBookmarkBtn');
      bmBtn.className = 'icon-btn' + (book.is_bookmarked ? ' is-active' : '');
      bmBtn.onclick = () => toggleBookmark(book.id);

      document.getElementById('dockStockMinus').onclick = () => adjustStock(book.id, -1);
      document.getElementById('dockStockPlus').onclick = () => adjustStock(book.id, 1);
      document.getElementById('dockEditBtn').onclick = () => openEditModal(book);
      document.getElementById('dockDeleteBtn').onclick = () => deleteBook(book.id);
    }

    async function toggleBookmark(id) {
      try {
        const res = await fetch(API_BASE + '/api/books/' + id + '/bookmark', {
          method: 'PATCH',
          headers: getAuthHeaders()
        });
        if (!res.ok) {
          showToast('Gagal mengubah bookmark', 'error');
          return;
        }
        const payload = await res.json();
        const updated = payload.data;
        allBooks = allBooks.map(b => (b.id === id ? updated : b));
        updateSidebarCounts();
        loadStats();
        renderCurrentView();
        renderDock();
        showToast(updated.is_bookmarked ? 'Ditambahkan ke Tersimpan' : 'Dihapus dari Tersimpan');
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    }

    async function adjustStock(id, delta) {
      try {
        const res = await fetch(API_BASE + '/api/books/' + id + '/stock', {
          method: 'PATCH',
          headers: getAuthHeaders(),
          body: JSON.stringify({ delta })
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          showToast(payload.message || 'Gagal mengubah stok', 'error');
          return;
        }
        const updated = payload.data;
        allBooks = allBooks.map(b => (b.id === id ? updated : b));
        updateSidebarCounts();
        loadStats();
        renderCurrentView();
        renderDock();
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    }

    function openAddModal() {
      lastOpener = document.activeElement;
      document.getElementById('dialogTitle').textContent = 'Tambah Buku Baru';
      document.getElementById('formSubmitBtn').textContent = 'Simpan Buku';
      document.getElementById('formBookId').value = '';
      document.getElementById('formTitle').value = '';
      document.getElementById('formAuthor').value = '';
      document.getElementById('formCategory').value = '';
      document.getElementById('formISBN').value = '';
      document.getElementById('formYear').value = '';
      document.getElementById('formStock').value = '1';
      document.getElementById('formDesc').value = '';
      document.getElementById('bookDialog').showModal();
      document.getElementById('formTitle').focus();
    }

    function openEditModal(book) {
      lastOpener = document.activeElement;
      document.getElementById('dialogTitle').textContent = 'Edit Data Buku #' + book.id;
      document.getElementById('formSubmitBtn').textContent = 'Simpan Perubahan';
      document.getElementById('formBookId').value = book.id;
      document.getElementById('formTitle').value = book.title || '';
      document.getElementById('formAuthor').value = book.author || '';
      document.getElementById('formCategory').value = book.category || '';
      document.getElementById('formISBN').value = book.isbn || '';
      document.getElementById('formYear').value = book.publish_year > 0 ? book.publish_year : '';
      document.getElementById('formStock').value = book.stock != null ? book.stock : 0;
      document.getElementById('formDesc').value = book.description || '';
      document.getElementById('bookDialog').showModal();
      document.getElementById('formTitle').focus();
    }

    function closeBookDialog() {
      document.getElementById('bookDialog').close();
      if (lastOpener && typeof lastOpener.focus === 'function') lastOpener.focus();
    }

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('formBookId').value;
      const body = {
        title: document.getElementById('formTitle').value.trim(),
        author: document.getElementById('formAuthor').value.trim(),
        category: document.getElementById('formCategory').value.trim(),
        isbn: document.getElementById('formISBN').value.trim(),
        publish_year: parseInt(document.getElementById('formYear').value, 10) || 0,
        stock: parseInt(document.getElementById('formStock').value, 10) || 0,
        description: document.getElementById('formDesc').value.trim()
      };

      const isEdit = Boolean(id);
      const url = API_BASE + (isEdit ? '/api/books/' + id : '/api/books');
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: getAuthHeaders(),
          body: JSON.stringify(body)
        });
        if (res.ok) {
          showToast(isEdit ? 'Buku #' + id + ' berhasil diperbarui!' : 'Buku berhasil ditambahkan!');
          closeBookDialog();
          loadBooks(document.getElementById('searchInput').value.trim());
        } else {
          const err = await res.json().catch(() => ({}));
          const msg = isEdit ? (err.message || 'Gagal memperbarui buku') : (err.message || 'Gagal menambah buku');
          showToast(msg, 'error');
        }
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    });

    async function deleteBook(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus buku #' + id + '?')) return;
      try {
        const res = await fetch(API_BASE + '/api/books/' + id, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        if (res.status === 204) {
          showToast('Buku #' + id + ' berhasil dihapus!');
          loadBooks(document.getElementById('searchInput').value.trim());
        } else {
          showToast('Gagal menghapus buku', 'error');
        }
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    }

    function searchBooks() {
      const q = document.getElementById('searchInput').value.trim();
      loadBooks(q);
    }

    function resetSearch() {
      document.getElementById('searchInput').value = '';
      activeCategory = 'Semua';
      activeSort = '';
      const sortEl = document.getElementById('sortSelect');
      if (sortEl) sortEl.value = '';
      loadBooks();
    }

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      activeSort = e.target.value;
      loadBooks(document.getElementById('searchInput').value.trim());
    });

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchBooks();
      }
    });

    (function initMotionAndParallax() {
      const topbar = document.querySelector('.topbar');
      const heroGrid = document.getElementById('heroGrid');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let scrollRaf = null;

      function applyScrollEffects() {
        const y = window.scrollY || window.pageYOffset || 0;
        if (topbar) topbar.classList.toggle('is-scrolled', y > 16);
        if (!reduced) {
          const clamped = Math.min(240, y);
          document.documentElement.style.setProperty('--scroll-y', String(clamped));
          document.querySelectorAll('.parallax-card').forEach(card => {
            const factor = parseFloat(card.dataset.parallax || '0');
            const rect = card.getBoundingClientRect();
            const centerOffset = (rect.top + rect.height / 2) - window.innerHeight / 2;
            const shift = Math.max(-10, Math.min(10, centerOffset * factor));
            card.style.setProperty('--card-py', shift.toFixed(1) + 'px');
          });
        }
        scrollRaf = null;
      }

      window.addEventListener('scroll', () => {
        if (!scrollRaf) scrollRaf = requestAnimationFrame(applyScrollEffects);
      }, { passive: true });
      applyScrollEffects();

      if (!reduced && heroGrid) {
        heroGrid.addEventListener('pointermove', (e) => {
          const card = e.target.closest('.hero-card');
          if (!card) return;
          const rect = card.getBoundingClientRect();
          const hx = (((e.clientX - rect.left) / rect.width) - 0.5) * 12;
          const hy = (((e.clientY - rect.top) / rect.height) - 0.5) * 10;
          card.style.setProperty('--hx', hx.toFixed(1) + 'px');
          card.style.setProperty('--hy', hy.toFixed(1) + 'px');
        });
        heroGrid.addEventListener('pointerleave', () => {
          heroGrid.querySelectorAll('.hero-card').forEach(c => {
            c.style.setProperty('--hx', '0px');
            c.style.setProperty('--hy', '0px');
          });
        });
      }
    })();

    checkAuth().then(isLoggedIn => {
      if (isLoggedIn) loadBooks();
    });
  </script>
</body>
</html>
