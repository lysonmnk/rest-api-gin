<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gin Books Manager - PostgreSQL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 20px 28px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    header p { opacity: 0.9; font-size: 13px; margin-top: 3px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-badge { background: rgba(255,255,255,0.18); padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 6px; }
    .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-logout:hover { background: #dc2626; transform: translateY(-1px); }
    .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: #0f172a; }
    .form-grid { display: grid; grid-template-columns: 2fr 1.5fr 1.5fr 1fr 1fr auto; gap: 10px; align-items: center; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 13.5px; font-family: inherit; transition: border-color 0.2s; outline: none; }
    input[type="text"]:focus, input[type="number"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    button { padding: 10px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-edit { background: #f59e0b; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .btn-edit:hover { background: #d97706; }
    .btn-delete { background: #ef4444; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; margin-left: 6px; }
    .btn-delete:hover { background: #dc2626; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .search-box { display: flex; gap: 10px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { text-align: left; padding: 12px 14px; background: #f8fafc; font-size: 13px; font-weight: 600; color: #64748b; border-bottom: 1.5px solid #e2e8f0; }
    td { padding: 14px 14px; border-bottom: 1px solid #f1f5f9; font-size: 13.5px; }
    tr:hover td { background: #f8fafc; }
    .tag-stock { background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 12px; font-weight: 600; font-size: 12px; }
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; color: white; font-size: 14px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; z-index: 1000; }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: white; padding: 28px; border-radius: 16px; width: 480px; max-width: 90%; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .empty-msg { text-align: center; color: #94a3b8; padding: 32px; font-size: 14px; }
    .date-text { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📚 Gin Books Management</h1>
        <p>Aplikasi CRUD Terproteksi • Database PostgreSQL (<b>gin_books_db</b>)</p>
      </div>
      <div class="header-right">
        <div class="user-badge">
          <span>👤</span>
          <span id="userNameLabel">Memuat...</span>
        </div>
        <button class="btn-logout" onclick="logout()" title="Keluar dari akun">🚪 Keluar</button>
      </div>
    </header>

    <div class="card">
      <div class="card-title">✨ Tambah Buku Baru</div>
      <form id="addBookForm" class="form-grid">
        <input type="text" id="newTitle" placeholder="Judul Buku..." required>
        <input type="text" id="newAuthor" placeholder="Penulis..." required>
        <input type="text" id="newISBN" placeholder="ISBN (cth: 978-602-001)">
        <input type="number" id="newYear" placeholder="Tahun" min="1900" max="2100">
        <input type="number" id="newStock" placeholder="Stok" min="0" value="1">
        <button type="submit" class="btn-primary">➕ Tambah</button>
      </form>
    </div>

    <div class="card">
      <div class="card-title">📖 Daftar Koleksi Buku</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari judul atau penulis buku (contoh: Gin, Ayu, Lyson)...">
        <button type="button" class="btn-primary" onclick="searchBooks()">Cari</button>
        <button type="button" class="btn-secondary" onclick="resetSearch()">Semua</button>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 50px;">ID</th>
            <th>Judul Buku</th>
            <th>Penulis</th>
            <th>ISBN</th>
            <th style="width: 70px;">Tahun</th>
            <th style="width: 70px;">Stok</th>
            <th style="width: 140px;">Dibuat Pada</th>
            <th style="width: 140px; text-align: center;">Aksi</th>
          </tr>
        </thead>
        <tbody id="booksTableBody"></tbody>
      </table>
      <div id="emptyMessage" class="empty-msg" style="display:none;">Tidak ada buku yang ditemukan.</div>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">✏️ Edit Data Buku</div>
      <form id="editBookForm">
        <input type="hidden" id="editBookId">
        <div class="form-group">
          <label>Judul Buku</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="form-group">
          <label>Penulis</label>
          <input type="text" id="editAuthor" required>
        </div>
        <div class="form-group">
          <label>ISBN</label>
          <input type="text" id="editISBN" placeholder="ISBN">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>Tahun Terbit</label>
            <input type="number" id="editYear" min="1900" max="2100">
          </div>
          <div class="form-group">
            <label>Stok</label>
            <input type="number" id="editStock" min="0">
          </div>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-secondary" onclick="closeEditModal()">Batal</button>
          <button type="submit" class="btn-primary">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = window.location.protocol.startsWith('http') ? '' : 'http://localhost:8080';

    function getAuthHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('auth_token');
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      }
      return headers;
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.className = 'toast ' + type;
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr.startsWith('0001-01-01')) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function checkAuth() {
      try {
        const res = await fetch(API_BASE + '/api/me', {
          headers: getAuthHeaders()
        });
        if (!res.ok) {
          window.location.href = '/login';
          return false;
        }
        const data = await res.json();
        if (data.data) {
          document.getElementById('userNameLabel').innerText = data.data.full_name + ' (' + data.data.role + ')';
        }
        return true;
      } catch (err) {
        window.location.href = '/login';
        return false;
      }
    }

    async function logout() {
      if (!confirm('Apakah Anda yakin ingin keluar?')) return;
      try {
        await fetch(API_BASE + '/api/logout', {
          method: 'POST',
          headers: getAuthHeaders()
        });
      } catch (e) {}
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_profile');
      window.location.href = '/login';
    }

    async function loadBooks(searchQuery = '') {
      try {
        let url = API_BASE + '/api/books';
        if (searchQuery) url += '?q=' + encodeURIComponent(searchQuery);
        const res = await fetch(url, { headers: getAuthHeaders() });
        
        if (res.status === 401) {
          window.location.href = '/login';
          return;
        }

        const data = await res.json();
        const tbody = document.getElementById('booksTableBody');
        tbody.innerHTML = '';

        if (!data.data || data.data.length === 0) {
          document.getElementById('emptyMessage').style.display = 'block';
          return;
        }
        document.getElementById('emptyMessage').style.display = 'none';

        function makeCell(tag, text, className) {
          const td = document.createElement('td');
          if (!tag) {
            td.textContent = text;
            return td;
          }
          const el = document.createElement(tag);
          if (className) el.className = className;
          el.textContent = text;
          td.appendChild(el);
          return td;
        }

        data.data.forEach(book => {
          const tr = document.createElement('tr');
          const isbn = book.isbn || '-';
          const year = book.publish_year > 0 ? book.publish_year : '-';
          const stock = book.stock != null ? book.stock : 0;
          const createdAt = formatDate(book.created_at);

          tr.appendChild(makeCell('b', '#' + book.id));
          tr.appendChild(makeCell('b', book.title));
          tr.appendChild(makeCell(null, book.author));
          tr.appendChild(makeCell('code', isbn));
          tr.appendChild(makeCell(null, String(year)));
          tr.appendChild(makeCell('span', stock + ' pcs', 'tag-stock'));
          tr.appendChild(makeCell('span', createdAt, 'date-text'));

          const actionsTd = document.createElement('td');
          actionsTd.style.textAlign = 'center';

          const editBtn = document.createElement('button');
          editBtn.className = 'btn-edit';
          editBtn.textContent = '✏️ Edit';
          editBtn.addEventListener('click', () => {
            openEditModal(book.id, book.title, book.author, book.isbn || '', book.publish_year || 0, book.stock || 0);
          });

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-delete';
          deleteBtn.textContent = '🗑️ Hapus';
          deleteBtn.addEventListener('click', () => deleteBook(book.id));

          actionsTd.appendChild(editBtn);
          actionsTd.appendChild(deleteBtn);
          tr.appendChild(actionsTd);

          tbody.appendChild(tr);
        });
      } catch (err) {
        showToast('Gagal memuat data buku', 'error');
      }
    }

    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('newTitle').value.trim();
      const author = document.getElementById('newAuthor').value.trim();
      const isbn = document.getElementById('newISBN').value.trim();
      const publish_year = parseInt(document.getElementById('newYear').value) || 0;
      const stock = parseInt(document.getElementById('newStock').value) || 0;

      if (!title || !author) return;

      try {
        const res = await fetch(API_BASE + '/api/books', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ title, author, isbn, publish_year, stock })
        });
        if (res.ok) {
          showToast('Buku berhasil ditambahkan ke PostgreSQL!');
          document.getElementById('newTitle').value = '';
          document.getElementById('newAuthor').value = '';
          document.getElementById('newISBN').value = '';
          document.getElementById('newYear').value = '';
          document.getElementById('newStock').value = '1';
          loadBooks();
        } else {
          const err = await res.json();
          showToast(err.message || 'Gagal menambah buku', 'error');
        }
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    });

    async function deleteBook(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus buku #' + id + '?')) return;
      try {
        const res = await fetch(API_BASE + '/api/books/' + id, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        if (res.status === 204) {
          showToast('Buku #' + id + ' berhasil dihapus!');
          loadBooks();
        } else {
          showToast('Gagal menghapus buku', 'error');
        }
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    }

    function openEditModal(id, title, author, isbn, year, stock) {
      document.getElementById('editBookId').value = id;
      document.getElementById('editTitle').value = title;
      document.getElementById('editAuthor').value = author;
      document.getElementById('editISBN').value = isbn || '';
      document.getElementById('editYear').value = year > 0 ? year : '';
      document.getElementById('editStock').value = stock != null ? stock : 0;
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    document.getElementById('editBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editBookId').value;
      const title = document.getElementById('editTitle').value.trim();
      const author = document.getElementById('editAuthor').value.trim();
      const isbn = document.getElementById('editISBN').value.trim();
      const publish_year = parseInt(document.getElementById('editYear').value) || 0;
      const stock = parseInt(document.getElementById('editStock').value) || 0;

      try {
        const res = await fetch(API_BASE + '/api/books/' + id, {
          method: 'PUT',
          headers: getAuthHeaders(),
          body: JSON.stringify({ title, author, isbn, publish_year, stock })
        });
        if (res.ok) {
          showToast('Buku #' + id + ' berhasil diperbarui!');
          closeEditModal();
          loadBooks();
        } else {
          const err = await res.json().catch(() => ({}));
          showToast(err.message || 'Gagal memperbarui buku', 'error');
        }
      } catch (err) {
        showToast('Koneksi gagal', 'error');
      }
    });

    function searchBooks() {
      const q = document.getElementById('searchInput').value.trim();
      loadBooks(q);
    }

    function resetSearch() {
      document.getElementById('searchInput').value = '';
      loadBooks();
    }

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchBooks();
      }
    });

    checkAuth().then(isLoggedIn => {
      if (isLoggedIn) loadBooks();
    });
  </script>
</body>
</html>
